# Claude i GitHub: skriv @claude i ett ärende (issue) eller en pull request, så
# gör Claude ändringen och öppnar en pull request. Vercel ger varje pull request
# en egen förhandsvisningslänk.
#
# Kräver en gång per repo (npm run github:claude guidar dig):
#   1. Claudes GitHub-app: https://github.com/apps/claude
#   2. Hemligheten CLAUDE_CODE_OAUTH_TOKEN (från `claude setup-token`)
# Utan hemligheten hoppas jobbet över, så inget går sönder.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        if: env.HAS_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(npm install),Bash(npm ci),Bash(npm run typecheck),Bash(npm run build),Bash(npm run theme *),Bash(npx shadcn@latest *)"
